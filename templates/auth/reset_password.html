{% extends "base.html" %}

{% block title %}Enter New Password — Kwuo{% endblock %}

{% block content %}
<div class="flex min-h-[80vh] items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
    <div
        class="w-full max-w-md space-y-8 rounded-3xl border border-theme-border bg-theme-surface p-8 shadow-sm transition-colors text-center">
        <div>
            <div class="flex justify-center">
                <span
                    class="flex h-14 w-14 items-center justify-center rounded-2xl bg-kwuo-sand/50 text-kwuo-bronze dark:bg-kwuo-dark-accent dark:text-kwuo-gold text-2xl shadow-sm border border-kwuo-sage/30">
                    <i class="ph-duotone ph-shield-check text-3xl"></i>
                </span>
            </div>
            <h2 class="mt-4 text-center text-2xl font-heading font-extrabold tracking-tight text-theme-heading">
                Set New Password
            </h2>
            <p class="mt-2 text-center text-xs sm:text-sm text-slate-600 dark:text-kwuo-sage">
                Enter the 6-digit code sent to
                <span class="font-bold font-body text-slate-900 dark:text-white block mt-0.5">{{ email or "your email"
                    }}</span>
            </p>
        </div>

        <div id="reset-error">
            {% if error %}
            <div
                class="rounded-xl bg-rose-50 dark:bg-rose-950/40 p-3 text-sm text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-900/60 flex items-center gap-2 text-left">
                <i class="ph-bold ph-warning-circle text-base shrink-0"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}
        </div>

        <form class="mt-6 space-y-5 text-left" action="/auth/reset-password" method="POST"
            hx-post="/auth/reset-password" hx-target="#reset-error" hx-swap="innerHTML">
            <input type="hidden" name="email" value="{{ email }}">

            <div>
                <label for="code"
                    class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-kwuo-gold mb-1">
                    6-Digit Authorization Code
                </label>
                <input id="code" name="code" type="text" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" required
                    autofocus
                    class="block w-full text-center tracking-[0.4em] font-body text-xl font-bold py-2.5 px-4 rounded-xl border border-slate-300 dark:border-kwuo-dark-input bg-white dark:bg-kwuo-dark-surface text-slate-900 dark:text-kwuo-sand shadow-sm focus:border-kwuo-bronze focus:ring-1 focus:ring-kwuo-bronze"
                    placeholder="••••••">
            </div>

            <div>
                <label for="new_password"
                    class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-kwuo-gold mb-1">
                    New Password
                </label>
                <input id="new_password" name="new_password" type="password" minlength="8" required
                    class="block w-full rounded-xl border border-slate-300 dark:border-kwuo-dark-input bg-white dark:bg-kwuo-dark-surface text-slate-900 dark:text-kwuo-sand shadow-sm focus:border-kwuo-bronze focus:ring-kwuo-bronze text-sm p-3"
                    placeholder="At least 8 characters">
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="kwuo-btn kwuo-btn-primary kwuo-btn-md w-full bg-kwuo-bronze px-5 py-3 text-sm font-bold text-white shadow hover:bg-kwuo-mahogany transition flex items-center justify-center gap-2">
                    <span>Update Password &amp; Invalidate Sessions</span>
                    <i class="ph-bold ph-check"></i>
                </button>
            </div>
        </form>

        <div
            class="pt-4 border-t border-theme-border-subtle flex items-center justify-between text-xs text-slate-500 dark:text-kwuo-sage">
            <span>Didn't receive code?</span>
            <form action="/auth/resend-otp" method="POST" hx-post="/auth/resend-otp" hx-target="#reset-error"
                hx-swap="innerHTML">
                <input type="hidden" name="email" value="{{ email }}">
                <input type="hidden" name="action" value="password_reset">
                <button type="submit"
                    class="font-semibold text-kwuo-bronze dark:text-kwuo-gold hover:underline flex items-center gap-1">
                    <i class="ph-bold ph-arrows-clockwise"></i>
                    <span>Resend Code</span>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
