{% extends "base.html" %}

{% block title %}Forgot Password — Kwuo{% endblock %}

{% block content %}
<div class="flex min-h-[80vh] items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
    <div class="w-full max-w-md space-y-8 rounded-3xl border border-theme-border bg-theme-surface p-8 shadow-sm transition-colors text-center">
        <div>
            <div class="flex justify-center">
                <span class="flex h-14 w-14 items-center justify-center rounded-2xl bg-kwuo-sand/50 text-kwuo-bronze dark:bg-kwuo-dark-accent dark:text-kwuo-gold text-2xl shadow-sm border border-kwuo-sage/30">
                    <i class="ph-duotone ph-lock-key text-3xl"></i>
                </span>
            </div>
            <h2 class="mt-4 text-center text-2xl font-heading font-extrabold tracking-tight text-theme-heading">
                Reset Your Password
            </h2>
            <p class="mt-2 text-center text-xs sm:text-sm text-slate-600 dark:text-kwuo-sage">
                Enter your account email address and we'll dispatch a 6-digit authorization code.
            </p>
        </div>

        <div id="forgot-error">
            {% if error %}
            <div class="rounded-xl bg-rose-50 dark:bg-rose-950/40 p-3 text-sm text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-900/60 flex items-center gap-2 text-left">
                <i class="ph-bold ph-warning-circle text-base shrink-0"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}
        </div>

        <form class="mt-6 space-y-5 text-left" action="/auth/forgot-password" method="POST">
            <div>
                <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-kwuo-gold mb-1">
                    Email address
                </label>
                <input id="email" name="email" type="email" required autofocus
                    class="block w-full rounded-xl border border-slate-300 dark:border-kwuo-dark-input bg-white dark:bg-kwuo-dark-surface text-slate-900 dark:text-kwuo-sand shadow-sm focus:border-kwuo-bronze focus:ring-kwuo-bronze text-sm p-3"
                    placeholder="organizer@university.edu">
            </div>

            <div class="pt-2">
                <button type="submit"
                    class="kwuo-btn kwuo-btn-primary kwuo-btn-md w-full bg-kwuo-bronze px-5 py-3 text-sm font-bold text-white shadow hover:bg-kwuo-mahogany transition flex items-center justify-center gap-2">
                    <span>Send Reset Code</span>
                    <i class="ph-bold ph-paper-plane-right"></i>
                </button>
            </div>
        </form>

        <div class="pt-4 border-t border-theme-border-subtle text-xs text-slate-500 dark:text-kwuo-sage">
            Remember your password?
            <a href="/auth/login" class="font-semibold text-kwuo-bronze dark:text-kwuo-gold hover:underline ml-1">
                Back to Sign In
            </a>
        </div>
    </div>
</div>
{% endblock %}
