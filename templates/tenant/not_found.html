<!DOCTYPE html>
<html lang="en" class="h-full antialiased">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Not Found — Kwuo</title>
    <!-- Compiled Local Stylesheet (Tailwind CSS, Self-Hosted Fonts & Phosphor Icons) -->
    <link rel="stylesheet" href="/static/css/app.min.css">
</head>

<body class="h-full bg-kwuo-sand text-kwuo-mahogany flex flex-col items-center justify-center px-4">
    <div class="max-w-md w-full text-center">
        <div
            class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-kwuo-bronze/10 text-kwuo-bronze mb-6">
            <i class="ph-bold ph-trophy text-3xl"></i>
        </div>
        <h1 class="text-3xl font-heading font-extrabold tracking-tight sm:text-4xl">
            {% if message %}Page Unavailable{% else %}Tournament Not Found{% endif %}
        </h1>
        <p class="mt-3 text-base text-kwuo-mahogany/70">
            {% if message %}
            {{ message }}
            {% else %}
            The tournament subdomain <span class="font-body font-bold text-kwuo-bronze">{{ subdomain }}</span> does not
            exist or has been archived.
            {% endif %}
        </p>
        <div class="mt-8 flex justify-center gap-3">
            <a href="http://localhost:8000"
                class="inline-flex items-center gap-2 rounded-xl bg-kwuo-mahogany px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-kwuo-bronze transition">
                <i class="ph-bold ph-house"></i>
                <span>Return to Kwuo Home</span>
            </a>
        </div>
    </div>
</body>

</html>
