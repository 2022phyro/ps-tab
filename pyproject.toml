[project]
name = "kwuo"
version = "0.1.0"
description = "Kwuo — Public Speaking Tabulation Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown>=3.11.2",
    "msgpack>=1.2.4",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pygments>=2.21.0",
    "python-frontmatter>=1.3.0",
    "python-multipart>=0.0.32",
    "redis>=5.3.1",
    "sqlalchemy>=2.1.6",
    "taskipy>=1.14.1",
    "typeid-python>=0.3.11",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kwuo"]

[tool.taskipy.tasks]
dev = "uvicorn kwuo.main:app --reload --host 0.0.0.0 --port 8000"
worker = "arq kwuo.worker.tasks.WorkerSettings"
test = "pytest"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]
